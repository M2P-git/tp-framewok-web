<!doctype html>
<!--
  Sans React 1 : une carte, un bouton, un total.
  Le même code que la diapo « 1 · La même carte, en code » (séance 2).
  Ouvrir ce fichier par double-clic, cliquer sur « Ajouter », puis encore une fois.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Sans React 1 : une carte</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; }
      .carte { border: 2px solid #ccc; border-radius: 8px; padding: 0.5rem 1rem; }
      .choisie { border-color: green; }
    </style>
  </head>
  <body>
    <article id="coupe" class="carte">
      <h3>Coupe femme</h3>
      <p>45 min · 135 DH</p>
      <button>+ Ajouter</button>
    </article>
    <p>Total :
      <span id="total">0</span> DH</p>

    <script>
      // 1. Trouver les éléments
      const carte = document.querySelector('#coupe');
      const bouton = carte.querySelector('button');
      const total = document.querySelector('#total');
      // 2. Écouter le clic
      bouton.addEventListener('click', () => {
        // 3. Modifier la page
        carte.classList.toggle('choisie');
        if (carte.classList.contains('choisie')) {
          bouton.textContent = '✓ Ajoutée';
          total.textContent = Number(total.textContent) + 135;
        } else {
          bouton.textContent = '+ Ajouter';
          total.textContent = Number(total.textContent) - 135;
        }
      });
    </script>
  </body>
</html>
