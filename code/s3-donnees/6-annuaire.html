<!doctype html>
<!--
  S3, démo 6 : les établissements d'une ville. Généré par generer.py depuis jsx/annuaire.jsx : pour changer le code, modifier le .jsx.
  Le code est celui d'un src/App.jsx de projet Vite. Pour s'ouvrir par double-clic, sans outil
  ni connexion, la page charge React et Babel (qui traduit le JSX) depuis ../s2-avec-react/lib/.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>S3, démo 6 : les établissements d'une ville</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 420px; margin: 1.5rem auto; padding: 0 1rem; }
      /* src/App.css : les styles des démos de la séance 3 (les cartes, les messages). */
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
      .carte {
        border: 2px solid #ccc;
        border-radius: 8px;
        padding: 0.2rem 0.8rem;
      }
      .carte h3 {
        margin: 0.3rem 0;
        font-size: 1.05rem;
      }
      .carte p {
        margin: 0.3rem 0;
      }
      .erreur {
        color: #b31a1a;
        font-weight: bold;
      }
      button {
        font-size: 1rem;
        padding: 0.3rem 0.8rem;
      }
      /* Les formulaires (notions 7 à 11) : un champ par ligne */
      label {
        display: block;
        margin: 0.4rem 0;
      }
      input,
      select {
        font-size: 1rem;
        padding: 0.15rem 0.3rem;
      }
      form .erreur {
        margin: 0 0 0.4rem;
        font-size: 0.9rem;
      }
    </style>
    <script src="../s2-avec-react/lib/react.development.js"></script>
    <script src="../s2-avec-react/lib/react-dom.development.js"></script>
    <script src="../s2-avec-react/lib/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;
      // src/App.jsx : les établissements d'une ville (notion 6)
      // L'API doit tourner : node api-simulee/serveur.mjs (dépôt des TP)

      const API = 'http://localhost:3001/api';
      const VILLES = ['Rabat', 'Casablanca', 'Marrakech', 'Fès'];

      function App() {
        const [ville, setVille] = useState('Rabat');
        const [etablissements, setEtablissements] = useState([]);

        // Relancé au premier affichage, puis à chaque changement de ville
        useEffect(() => {
          async function charger() {
            const reponse = await fetch(API + '/businesses?city=' + ville);
            const page = await reponse.json();
            setEtablissements(page.items);
          }
          charger();
        }, [ville]);

        return (
          <>
            <label>
              Ville{' '}
              <select value={ville} onChange={(e) => setVille(e.target.value)}>
                {VILLES.map((nom) => (
                  <option key={nom}>{nom}</option>
                ))}
              </select>
            </label>
            <p>{etablissements.length} établissements</p>
            <ul>
              {etablissements.map((etablissement) => (
                <li key={etablissement.id}>{etablissement.name}</li>
              ))}
            </ul>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
