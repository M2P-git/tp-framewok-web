<!doctype html>
<!--
  S3, démo 5 : chargement, erreur, vide. Généré par generer.py depuis jsx/etats.jsx : pour changer le code, modifier le .jsx.
  Le code est celui d'un src/App.jsx de projet Vite. Pour s'ouvrir par double-clic, sans outil
  ni connexion, la page charge React et Babel (qui traduit le JSX) depuis ../s2-avec-react/lib/.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>S3, démo 5 : chargement, erreur, vide</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 420px; margin: 1.5rem auto; padding: 0 1rem; }
      /* src/App.css : les styles des démos de la séance 3 (les cartes, les messages). */
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
      .carte {
        border: 2px solid #ccc;
        border-radius: 8px;
        padding: 0.2rem 0.8rem;
      }
      .carte h3 {
        margin: 0.3rem 0;
        font-size: 1.05rem;
      }
      .carte p {
        margin: 0.3rem 0;
      }
      .erreur {
        color: #b31a1a;
        font-weight: bold;
      }
      button {
        font-size: 1rem;
        padding: 0.3rem 0.8rem;
      }
      /* Les formulaires (notions 7 à 11) : un champ par ligne */
      label {
        display: block;
        margin: 0.4rem 0;
      }
      input,
      select {
        font-size: 1rem;
        padding: 0.15rem 0.3rem;
      }
      form .erreur {
        margin: 0 0 0.4rem;
        font-size: 0.9rem;
      }
    </style>
    <script src="../s2-avec-react/lib/react.development.js"></script>
    <script src="../s2-avec-react/lib/react-dom.development.js"></script>
    <script src="../s2-avec-react/lib/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;
      // src/App.jsx : les états d'un écran qui charge (notion 5)
      // L'API doit tourner : node api-simulee/serveur.mjs (dépôt des TP)

      const API = 'http://localhost:3001/api';
      // Pour voir l'erreur : ajoutez ?_panne=1 après services
      // (le serveur répond alors 500)
      const ADRESSE = API + '/businesses/salon-yasmine-rabat/services';

      function CarteService({ nom, prix }) {
        return (
          <article className="carte">
            <h3>{nom}</h3>
            <p>{prix} DH</p>
          </article>
        );
      }

      function App() {
        const [prestations, setPrestations] = useState([]);
        const [chargement, setChargement] = useState(true);
        const [erreur, setErreur] = useState(null);

        useEffect(() => {
          async function charger() {
            try {
              const reponse = await fetch(ADRESSE);
              if (reponse.ok) {
                setPrestations(await reponse.json());
              } else {
                setErreur('Erreur ' + reponse.status + ' : réessayez plus tard.');
              }
            } catch {
              setErreur('Le serveur ne répond pas.');
            }
            setChargement(false);
          }
          charger();
        }, []);

        if (chargement) return <p>Chargement des prestations…</p>;
        if (erreur) return <p className="erreur">{erreur}</p>;
        if (prestations.length === 0) return <p>Aucune prestation pour le moment.</p>;
        return (
          <main>
            {prestations.map((prestation) => (
              <CarteService
                key={prestation.id}
                nom={prestation.name}
                prix={prestation.priceMad}
              />
            ))}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
