<!doctype html>
<!--
  S3, démo 9 : réserver, et les réponses du serveur. Généré par generer.py depuis jsx/reserver.jsx : pour changer le code, modifier le .jsx.
  Le code est celui d'un src/App.jsx de projet Vite. Pour s'ouvrir par double-clic, sans outil
  ni connexion, la page charge React et Babel (qui traduit le JSX) depuis ../s2-avec-react/lib/.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>S3, démo 9 : réserver, et les réponses du serveur</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 420px; margin: 1.5rem auto; padding: 0 1rem; }
      /* src/App.css : les styles des démos de la séance 3 (les cartes, les messages). */
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
      .carte {
        border: 2px solid #ccc;
        border-radius: 8px;
        padding: 0.2rem 0.8rem;
      }
      .carte h3 {
        margin: 0.3rem 0;
        font-size: 1.05rem;
      }
      .carte p {
        margin: 0.3rem 0;
      }
      .erreur {
        color: #b31a1a;
        font-weight: bold;
      }
      button {
        font-size: 1rem;
        padding: 0.3rem 0.8rem;
      }
      /* Les formulaires (notions 7 à 11) : un champ par ligne */
      label {
        display: block;
        margin: 0.4rem 0;
      }
      input,
      select {
        font-size: 1rem;
        padding: 0.15rem 0.3rem;
      }
      form .erreur {
        margin: 0 0 0.4rem;
        font-size: 0.9rem;
      }
    </style>
    <script src="../s2-avec-react/lib/react.development.js"></script>
    <script src="../s2-avec-react/lib/react-dom.development.js"></script>
    <script src="../s2-avec-react/lib/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;
      // src/App.jsx : réserver un brushing (notions 9 à 11)
      // L'API doit tourner : node api-simulee/serveur.mjs (dépôt des TP)
      // Pas de validation dans le navigateur (notion 8) : on voit ce que répond le serveur.

      const API = 'http://localhost:3001/api';
      const SALON = 'b-01';        // le Salon Yasmine
      const PRESTATION = 'sv-004'; // un brushing
      const COIFFEUSE = 'st-001';  // Siham

      function App() {
        const [jour, setJour] = useState('');
        const [creneaux, setCreneaux] = useState([]);
        const [version, setVersion] = useState(0);
        const [heure, setHeure] = useState('');
        const [prenom, setPrenom] = useState('');
        const [nom, setNom] = useState('');
        const [telephone, setTelephone] = useState('');
        const [accord, setAccord] = useState(false);
        const [message, setMessage] = useState('');

        // Les créneaux libres du jour choisi (notion 6) ;
        // changer version les recharge
        useEffect(() => {
          if (jour === '') return;
          async function charger() {
            const reponse = await fetch(API + '/businesses/' + SALON
              + '/availability?date=' + jour
              + '&serviceIds=' + PRESTATION + '&staffId=' + COIFFEUSE);
            const dispo = await reponse.json();
            setCreneaux(dispo.slots);
          }
          charger();
        }, [jour, version]);

        async function envoyer(e) {
          e.preventDefault();
          const reservation = {
            businessId: SALON,
            serviceIds: [PRESTATION],
            staffId: COIFFEUSE,
            date: jour,
            time: heure,
            customer: { firstName: prenom, lastName: nom, phone: telephone },
            consent: accord,
          };
          const reponse = await fetch(API + '/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reservation),
          });
          const donnees = await reponse.json();
          if (reponse.status === 201) {
            setMessage('Réservé : ' + donnees.id);
          } else if (reponse.status === 409) {
            setMessage(donnees.message); // le créneau vient d'être pris
            setHeure('');                // l'heure n'est plus bonne
            setVersion(version + 1);     // recharger les créneaux
          } else if (reponse.status === 422) {
            setMessage(Object.values(donnees.errors).join(' '));
          } else {
            setMessage('Erreur ' + reponse.status);
          }
        }

        return (
          <form onSubmit={envoyer}>
            <label>
              Jour{' '}
              <input type="date" value={jour}
                onChange={(e) => setJour(e.target.value)} />
            </label>
            <label>
              Heure{' '}
              <select value={heure} onChange={(e) => setHeure(e.target.value)}>
                <option value="">{creneaux.length} créneaux libres</option>
                {creneaux.map((creneau) => (
                  <option key={creneau.time}>{creneau.time}</option>
                ))}
              </select>
            </label>
            <label>
              Prénom <input value={prenom}
                onChange={(e) => setPrenom(e.target.value)} />
            </label>
            <label>
              Nom <input value={nom}
                onChange={(e) => setNom(e.target.value)} />
            </label>
            <label>
              Téléphone <input type="tel" value={telephone}
                onChange={(e) => setTelephone(e.target.value)} />
            </label>
            <label>
              <input type="checkbox" checked={accord}
                onChange={(e) => setAccord(e.target.checked)} />
              {' '}J'accepte l'enregistrement de mes données
            </label>
            <button>Réserver</button>
            <p><strong>{message}</strong></p>
          </form>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
