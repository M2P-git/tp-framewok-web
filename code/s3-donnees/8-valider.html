<!doctype html>
<!--
  S3, démo 8 : valider avant d'envoyer. Généré par generer.py depuis jsx/valider.jsx : pour changer le code, modifier le .jsx.
  Le code est celui d'un src/App.jsx de projet Vite. Pour s'ouvrir par double-clic, sans outil
  ni connexion, la page charge React et Babel (qui traduit le JSX) depuis ../s2-avec-react/lib/.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>S3, démo 8 : valider avant d'envoyer</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 420px; margin: 1.5rem auto; padding: 0 1rem; }
      /* src/App.css : les styles des démos de la séance 3 (les cartes, les messages). */
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
      .carte {
        border: 2px solid #ccc;
        border-radius: 8px;
        padding: 0.2rem 0.8rem;
      }
      .carte h3 {
        margin: 0.3rem 0;
        font-size: 1.05rem;
      }
      .carte p {
        margin: 0.3rem 0;
      }
      .erreur {
        color: #b31a1a;
        font-weight: bold;
      }
      button {
        font-size: 1rem;
        padding: 0.3rem 0.8rem;
      }
      /* Les formulaires (notions 7 à 11) : un champ par ligne */
      label {
        display: block;
        margin: 0.4rem 0;
      }
      input,
      select {
        font-size: 1rem;
        padding: 0.15rem 0.3rem;
      }
      form .erreur {
        margin: 0 0 0.4rem;
        font-size: 0.9rem;
      }
    </style>
    <script src="../s2-avec-react/lib/react.development.js"></script>
    <script src="../s2-avec-react/lib/react-dom.development.js"></script>
    <script src="../s2-avec-react/lib/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;
      // src/App.jsx : valider avant d'envoyer (notion 8)

      // 10 chiffres, commençant par 05, 06 ou 07
      const TELEPHONE = /^0[5-7][0-9]{8}$/;

      function App() {
        const [prenom, setPrenom] = useState('');
        const [telephone, setTelephone] = useState('');
        const [accord, setAccord] = useState(false);
        const [erreurs, setErreurs] = useState({});
        const [message, setMessage] = useState('');

        // Renvoie un objet : un message par champ à corriger
        function valider() {
          const trouvees = {};
          // le prénom, sans les espaces autour
          if (prenom.trim().length < 2) {
            trouvees.prenom = 'Au moins 2 lettres.';
          }
          // le téléphone, sans ses espaces
          const chiffres = telephone.replaceAll(' ', '');
          if (!TELEPHONE.test(chiffres)) {
            trouvees.telephone = 'Exemple : 06 12 34 56 78.';
          }
          return trouvees;
        }

        function envoyer(e) {
          e.preventDefault(); // pas de rechargement de la page
          const trouvees = valider();
          setErreurs(trouvees);
          if (Object.keys(trouvees).length > 0) {
            setMessage('');
            return; // des erreurs : on n'envoie rien
          }
          setMessage('Tout est bon : la réservation peut partir.');
        }

        return (
          <form onSubmit={envoyer}>
            <label>
              Prénom{' '}
              <input value={prenom}
                onChange={(e) => setPrenom(e.target.value)} />
            </label>
            {erreurs.prenom && <p className="erreur">{erreurs.prenom}</p>}
            <label>
              Téléphone{' '}
              <input type="tel" value={telephone}
                onChange={(e) => setTelephone(e.target.value)} />
            </label>
            {erreurs.telephone && <p className="erreur">{erreurs.telephone}</p>}
            <label>
              <input type="checkbox" checked={accord}
                onChange={(e) => setAccord(e.target.checked)} />
              {' '}J'accepte l'enregistrement de mes données
            </label>
            <button>Réserver</button>
            <p>{message}</p>
          </form>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
