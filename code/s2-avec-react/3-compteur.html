<!doctype html>
<!--
  Avec React 3 : le compteur. Généré par generer.py depuis jsx/compteur.jsx : pour changer le code, modifier le .jsx.
  Le code est celui d'un src/App.jsx de projet Vite. Pour s'ouvrir par double-clic, sans outil
  ni connexion, la page charge React et Babel (qui traduit le JSX) depuis lib/, à côté.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Avec React 3 : le compteur</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 420px; margin: 1.5rem auto; padding: 0 1rem; }
      /* src/App.css : les styles des démos de la séance 2 (la carte, les boutons). */
      .carte {
        border: 2px solid #ccc;
        border-radius: 8px;
        padding: 0.5rem 1rem;
        margin: 0.5rem 0;
        max-width: 360px;
      }
      .choisie {
        border-color: green;
      }
      button {
        font-size: 1rem;
        padding: 0.3rem 0.8rem;
      }
    </style>
    <script src="lib/react.development.js"></script>
    <script src="lib/react-dom.development.js"></script>
    <script src="lib/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;
      // src/App.jsx : les deux compteurs du QCM 10

      // Une variable ordinaire : elle change (voir la console,
      // F12), mais React n'est pas prévenu : l'écran reste à 0
      function CompteurCasse() {
        let nombre = 0;
        return (
          <button onClick={() => {
            nombre = nombre + 1;
            console.log('nombre vaut', nombre);
          }}>
            Cliqué {nombre} fois
          </button>
        );
      }

      // L'état : React garde la valeur et redessine
      function Compteur() {
        const [nombre, setNombre] = useState(0);
        return (
          <button onClick={() => setNombre(nombre + 1)}>
            Cliqué {nombre} fois
          </button>
        );
      }

      function App() {
        return (
          <>
            <h2>Avec une variable ordinaire</h2>
            <CompteurCasse />
            <h2>Avec l'état</h2>
            <Compteur />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
