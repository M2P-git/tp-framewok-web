# Les programmes des TP, sans installer Node.js (optionnel).
#
#   docker compose up -d --build                 construit puis démarre « la machine » (1re fois : 1 à 3 min),
#                                                avec l'API (3001) et la démo (3002), en arrière-plan
#   docker compose exec node bash                ouvre un terminal DANS la machine
#   docker compose up api                        l'API simulée (http://localhost:3001)
#   docker compose up demo                       la démo MPA, SPA, SSR du TP S1.2 (http://localhost:3002)
#   docker compose run --rm labo 03-ordre.js 2   un exercice du TP S1.3
#   docker compose run --rm exercices            les tests JavaScript du TP S1 bis (ou : ... exercices npm run test:bases)
#   docker compose down                          tout arrêter
#
# Réglages : LATENCE=1500 PANNE=0.3 ALEATOIRE=1 docker compose up api
#            JS_DELAI=4000 docker compose up demo
# Sous PowerShell : $env:PANNE=0.3; docker compose up api

name: tp-frameworks-web

services:
  api:
    image: node:22-alpine
    working_dir: /tp/api-simulee
    command: ["node", "serveur.mjs"]
    volumes:
      - .:/tp:ro
    ports:
      - "3001:3001"
    environment:
      LATENCE: ${LATENCE:-300}
      PANNE: ${PANNE:-0}
      ALEATOIRE: ${ALEATOIRE:-0}

  demo:
    image: node:22-alpine
    working_dir: /tp/s1-2-architectures
    command: ["node", "serveur.mjs"]
    volumes:
      - .:/tp:ro
    ports:
      - "3002:3002"
    environment:
      JS_DELAI: ${JS_DELAI:-1500}
      LATENCE: ${LATENCE_DEMO:-400}

  labo:
    image: node:22-alpine
    working_dir: /tp/s1-3-debogage
    entrypoint: ["node"]
    command: ["03-ordre.js", "1"]
    volumes:
      - .:/tp:ro
    profiles: ["outils"]

  exercices:
    image: node:22-alpine
    working_dir: /tp/s1b-javascript-typescript
    entrypoint: ["npm"]
    command: ["test"]
    volumes:
      - .:/tp:ro
    profiles: ["outils"]

  # La « machine » de travail : Node.js 24, npm et Git, avec votre dépôt dedans.
  # Fabriquée à partir de docker/Dockerfile ; on y entre avec : docker compose exec node bash
  node:
    build:
      context: ./docker              # fabrique l'image avec le Dockerfile de ce dossier
    working_dir: /tp                 # on arrive dans /tp
    command: ["sleep", "infinity"]   # la machine n'exécute rien : elle attend qu'on s'y connecte
    init: true                       # arrêt rapide avec « docker compose down »
    volumes:
      - .:/tp                        # le dépôt de votre ordinateur (.) devient le dossier /tp de la machine
    ports:
      - "5173:5173"                  # React (Vite)
      - "3003:3003"                  # Next.js
      - "4200:4200"                  # Angular
    environment:
      CHOKIDAR_USEPOLLING: "true"    # recharger la page quand un fichier change,
      WATCHPACK_POLLING: "true"      # même dans un dossier partagé (Windows, macOS)
